<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="758" viewBox="0 0 1080 758" role="img" aria-labelledby="title desc">
<title id="title">GraphMind</title>
<desc id="desc">HotpotQA and MuSiQue supply the candidate text. BM25 and MiniLM use the question. Fused scores seed the paragraph graph. Recorded rankings feed FLAN and scoring. Gold labels flow only to training selection and evaluation. A full model-free replay verifies ranks, prompts, outputs and metrics before Pages serves them. A separate browser worker executes custom questions with the same Python core.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#806022"/></marker>
</defs>
