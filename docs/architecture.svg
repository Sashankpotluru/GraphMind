.title{font-size:34px;font-weight:700;letter-spacing:-1px}.lane{font-size:20px;font-weight:700}
.node{font-size:16px;font-weight:700}.sub{font-size:14px;fill:#594b5b}.edge-label{font-size:12px;fill:#6e521f;font-weight:600}
.box{fill:#fff;stroke:#c6b8ca;stroke-width:1.5}.lane-bg{fill:#f5f0f6;stroke:#ded4e2}.gold{fill:#faf2df;stroke:#c7b17e;stroke-width:1.5}
.dark{fill:#63284e}.inverse{fill:white}.arrow{fill:none;stroke:#806022;stroke-width:2.1;marker-end:url(#arrow)}
</style>
